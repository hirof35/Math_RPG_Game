<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>算数クエスト - 伝説の計算導師</title>
    <style>
        /* --- CSS: デザイン --- */
        body {
            background-color: #2e4d2e; /* 初期：森 */
            color: white;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            transition: background 1s ease;
            overflow: hidden;
        }

        /* ステージ背景クラス */
        body.cave { background-color: #332b3d; }
        body.castle { background-color: #1a1a2e; border: 8px double #ffd700; }
        body.magma { background-color: #4b0000; box-shadow: inset 0 0 100px #f00; }

        #game-container {
            width: 450px;
            background: rgba(0, 0, 0, 0.85);
            border: 4px solid #fff;
            padding: 20px;
            text-align: center;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }

        /* セーブデータ・ステータス */
        #save-data { font-size: 12px; color: #ffd700; margin-bottom: 10px; }
        .stats { display: flex; justify-content: space-between; margin-bottom: 15px; font-weight: bold; }

        /* 演出アニメーション */
        #battle-scene { font-size: 60px; margin: 20px 0; min-height: 80px; }
        .boss-sprite { transform: scale(2); display: inline-block; filter: drop-shadow(0 0 10px #f00); }
        
        .shake { animation: shake 0.5s; }
        @keyframes shake {
            0%, 100% { transform: translate(0,0); }
            10%, 30%, 50%, 70%, 90% { transform: translate(-5px, 0); }
            20%, 40%, 60%, 80% { transform: translate(5px, 0); }
        }

        /* タイマーバー */
        #timer-container { width: 100%; height: 12px; background: #444; border-radius: 6px; margin-bottom: 15px; overflow: hidden; }
        #timer-bar { width: 100%; height: 100%; background: #ff0; transition: width 0.1s linear; }
        .timer-boss { background: #800080 !important; box-shadow: 0 0 10px #ff00ff; }

        /* 入力エリア */
        #answer-input { padding: 10px; width: 120px; font-size: 20px; text-align: center; }
        button { padding: 10px 20px; font-size: 18px; cursor: pointer; background: #fff; border: none; font-weight: bold; }
        button:hover { background: #ddd; }

        /* 画面切り替え */
        .screen { display: none; }
        .active { display: block; }

        #start-screen, #ending-screen { padding: 20px; }
        h1 { color: #ffd700; text-shadow: 2px 2px #f00; }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="start-screen" class="screen active">
            <h1>🔢 算数クエスト</h1>
            <p>魔王から計算の理を取り戻せ！</p>
            <div id="save-data">Best Level: <span id="best-lv">1</span></div>
            <button onclick="startGame()">冒険に出る</button>
        </div>

        <div id="main-game" class="screen">
            <div class="stats">
                <div id="player-lv">Lv: 1</div>
                <div id="combo-display">Combo: 0</div>
            </div>
            <div class="stats" style="color: #ff4444;">
                <div id="monster-hp">敵 HP: 50</div>
                <div id="player-hp" style="color: #44ff44;">自分 HP: 50</div>
            </div>

            <div id="timer-container"><div id="timer-bar"></div></div>

            <div id="battle-scene">
                <div id="monster-sprite">👾</div>
            </div>
            
            <div id="message">モンスターが現れた！</div>
            <div id="skill-ready" style="color: #ff0; display:none;">🔥 POWER UP! x2 DAMAGE 🔥</div>

            <div id="quiz-area" style="margin-top: 20px;">
                <div id="question" style="font-size: 24px; margin-bottom: 10px;">? + ? = ?</div>
                <input type="number" id="answer-input" placeholder="答え">
                <button onclick="checkAnswer()">攻撃</button>
            </div>
        </div>

        <div id="ending-screen" class="screen">
            <h1>🎉 WORLD CLEAR!</h1>
            <p>伝説の計算導師として讃えられました。</p>
            <button onclick="location.reload()">もう一度遊ぶ</button>
        </div>
    </div>

    <script>
        /* --- JS: ロジック --- */
        let level = 1, monsterHP = 50, playerHP = 50, combo = 0;
        let currentAnswer = 0, timeLeft = 0, timerInterval = null;
        let isBossBattle = false, isPowerUp = false;

        // 音声（ダミーURLなので、必要に応じて差し替えてください）
        const sounds = {
            correct: new Audio('https://phiary.me/sandbox/sample/se/correct.mp3'),
            miss: new Audio('https://phiary.me/sandbox/sample/se/miss.mp3'),
            levelUp: new Audio('https://phiary.me/sandbox/sample/se/powerup.mp3')
        };

        window.onload = () => {
            document.getElementById('best-lv').innerText = localStorage.getItem('mathRpg_bestLv') || 1;
        };

        function startGame() {
            document.getElementById('start-screen').classList.remove('active');
            document.getElementById('main-game').classList.add('active');
            resetGame();
        }

        function resetGame() {
            level = 1; playerHP = 50; combo = 0; isPowerUp = false;
            updateStats();
            updateBackground();
            updateMonster();
            nextQuestion();
        }

        function nextQuestion() {
            const max = level * 10;
            const n1 = Math.floor(Math.random() * max) + 1;
            const n2 = Math.floor(Math.random() * max) + 1;
            
            if (level >= 3 && Math.random() > 0.5) {
                currentAnswer = n1 + n2;
                document.getElementById('question').innerText = `${n1} + ${n2} = ?`;
            } else {
                // 答えがマイナスにならないように調整
                const a = Math.max(n1, n2), b = Math.min(n1, n2);
                currentAnswer = a - b;
                document.getElementById('question').innerText = `${a} - ${b} = ?`;
            }
            startTimer();
        }

        function startTimer() {
            clearInterval(timerInterval);
            let limit = Math.max(30, 100 - (level * 4));
            if (isBossBattle) limit = Math.floor(limit * 0.7);
            
            timeLeft = limit;
            const bar = document.getElementById('timer-bar');
            if (isBossBattle) bar.classList.add('timer-boss'); else bar.classList.remove('timer-boss');

            timerInterval = setInterval(() => {
                timeLeft--;
                bar.style.width = (timeLeft / limit * 100) + "%";
                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    applyDamage(15, "タイムアップ！");
                }
            }, 100);
        }

        function checkAnswer() {
            const input = document.getElementById('answer-input');
            const val = parseInt(input.value);
            if (isNaN(val)) return;

            if (val === currentAnswer) {
                sounds.correct.play();
                let dmg = isPowerUp ? 40 : 20;
                monsterHP -= dmg;
                combo++;
                isPowerUp = (combo >= 3);
                document.getElementById('message').innerText = isPowerUp ? "3コンボ！力溜め！" : "命中！";
                if (monsterHP <= 0) levelUp(); else nextQuestion();
            } else {
                applyDamage(10, "ミス！反撃を受けた！");
            }
            input.value = "";
            input.focus();
            updateStats();
        }

        function applyDamage(dmg, msg) {
            sounds.miss.play();
            playerHP -= dmg;
            combo = 0; isPowerUp = false;
            document.getElementById('message').innerText = msg;
            document.getElementById('game-container').classList.add('shake');
            setTimeout(() => document.getElementById('game-container').classList.remove('shake'), 500);
            
            if (playerHP <= 0) {
                alert("力尽きた...");
                location.reload();
            } else {
                nextQuestion();
            }
            updateStats();
        }

        function levelUp() {
            clearInterval(timerInterval);
            if (level >= 20) {
                document.getElementById('main-game').classList.remove('active');
                document.getElementById('ending-screen').classList.add('active');
                return;
            }
            level++;
            sounds.levelUp.play();
            isBossBattle = (level % 5 === 0);
            monsterHP = isBossBattle ? 150 + (level * 10) : 50 + (level * 5);
            
            const best = localStorage.getItem('mathRpg_bestLv') || 0;
            if (level > best) localStorage.setItem('mathRpg_bestLv', level);

            updateBackground();
            updateMonster();
            updateStats();
            document.getElementById('message').innerText = isBossBattle ? "BOSSが現れた！" : "レベルアップ！";
            nextQuestion();
        }

        function updateStats() {
            document.getElementById('player-lv').innerText = `Lv: ${level}`;
            document.getElementById('monster-hp').innerText = `敵 HP: ${monsterHP}`;
            document.getElementById('player-hp').innerText = `自分 HP: ${playerHP}`;
            document.getElementById('combo-display').innerText = `Combo: ${combo}`;
            document.getElementById('skill-ready').style.display = isPowerUp ? "block" : "none";
        }

        function updateMonster() {
            const m = isBossBattle ? ["🐉", "👹", "👽", "👿"] : ["👾", "👻", "🤖", "💀"];
            const sprite = document.getElementById('monster-sprite');
            sprite.innerText = m[Math.floor(Math.random() * m.length)];
            if (isBossBattle) sprite.classList.add('boss-sprite'); else sprite.classList.remove('boss-sprite');
        }

        function updateBackground() {
            const b = document.body;
            b.className = "";
            if (level >= 15) b.classList.add('magma');
            else if (level >= 10) b.classList.add('castle');
            else if (level >= 5) b.classList.add('cave');
        }
    </script>
</body>
</html>
